<!DOCTYPE html>
<html>
<head>
    <title>Manipal OS Lab Assistant</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #0f172a, #020617);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .chat-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 65%;
            padding: 16px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-in-out;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 8px 25px rgba(99,102,241,0.35);
        }

        .bot {
            align-self: flex-start;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .sources {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .source-chip {
            background: rgba(255,255,255,0.08);
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0.8;
        }

        .input-area {
            display: flex;
            padding: 18px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            outline: none;
            font-size: 15px;
            background: rgba(255,255,255,0.08);
            color: white;
        }

        input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        button {
            margin-left: 10px;
            padding: 14px 22px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(139,92,246,0.4);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

    </style>
</head>

<body>

<div class="header">Manipal OS Lab Assistant</div>

<div class="chat-container">
    <div class="chat-wrapper">

        {% if question %}
        <div class="message user">
            {{ question }}
        </div>
        {% endif %}

        {% if answer %}
        <div class="message bot">
            {{ answer }}

            {% if sources %}
            <div class="sources">
                {% for s in sources %}
                <div class="source-chip">Page {{ s }}</div>
                {% endfor %}
            </div>
            {% endif %}

        </div>
        {% endif %}

    </div>
</div>

<form method="post" action="/ask" class="input-area">
    <input type="text" name="question" placeholder="Ask anything about Operating Systems..." required>
    <button type="submit">Send</button>
</form>

</body>
</html>
